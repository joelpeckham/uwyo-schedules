<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 32px 24px; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .box { width: 90px; height: 70px; background: #FFF; border-radius: 10px; }
  .l { font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); }
</style>
</head><body>
<div class="grid">
  <div class="tile"><div class="box" style="box-shadow: 0 1px 2px rgba(58,49,31,0.06);"></div><div class="l">xs</div></div>
  <div class="tile"><div class="box" style="box-shadow: 0 1px 2px rgba(58,49,31,0.06), 0 1px 3px rgba(58,49,31,0.08);"></div><div class="l">sm</div></div>
  <div class="tile"><div class="box" style="box-shadow: 0 4px 8px -2px rgba(58,49,31,0.08), 0 2px 4px -2px rgba(58,49,31,0.06);"></div><div class="l">md</div></div>
  <div class="tile"><div class="box" style="box-shadow: 0 12px 24px -8px rgba(58,49,31,0.12), 0 4px 8px -4px rgba(58,49,31,0.06);"></div><div class="l">lg</div></div>
  <div class="tile"><div class="box" style="box-shadow: 0 24px 48px -16px rgba(58,49,31,0.18), 0 8px 16px -8px rgba(58,49,31,0.08);"></div><div class="l">xl</div></div>
</div>
</body></html>
