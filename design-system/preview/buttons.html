<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 28px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  .btn { font-family: var(--font-sans); font-size: 14px; font-weight: 500; padding: 10px 18px; border-radius: 6px; border: 1px solid transparent; cursor: pointer; transition: all 200ms cubic-bezier(0.16,1,0.3,1); display: inline-flex; align-items: center; gap: 8px; }
  .btn-primary { background: var(--rust-400); color: var(--cream-50); }
  .btn-primary-hover { background: var(--rust-500); color: var(--cream-50); }
  .btn-primary-press { background: var(--rust-600); color: var(--cream-50); transform: translateY(1px); }
  .btn-secondary { background: var(--surface); color: var(--fg); border-color: var(--border-strong); }
  .btn-ghost { background: transparent; color: var(--fg-1); }
  .btn-danger { background: var(--clay-500); color: var(--cream-50); }
  .btn-disabled { background: var(--cream-200); color: var(--fg-muted); cursor: not-allowed; }
  .btn-sm { font-size: 13px; padding: 6px 12px; }
  .btn-lg { font-size: 16px; padding: 14px 24px; }
  .label { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); width: 90px; }
</style>
</head><body>
<div class="row"><span class="label">primary</span>
  <button class="btn btn-primary">Build a schedule</button>
  <button class="btn btn-primary-hover">Hover</button>
  <button class="btn btn-primary-press">Pressed</button>
  <button class="btn btn-disabled">Disabled</button>
</div>
<div class="row"><span class="label">secondary</span>
  <button class="btn btn-secondary">Add a class</button>
  <button class="btn btn-ghost">Cancel</button>
  <button class="btn btn-danger">Remove</button>
</div>
<div class="row"><span class="label">sizes</span>
  <button class="btn btn-primary btn-sm">Small</button>
  <button class="btn btn-primary">Default</button>
  <button class="btn btn-primary btn-lg">Large</button>
</div>
</body></html>
