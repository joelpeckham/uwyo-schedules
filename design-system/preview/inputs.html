<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 28px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  label { font-family: var(--font-sans); font-size: 13px; font-weight: 500; color: var(--fg-1); }
  .input { font-family: var(--font-sans); font-size: 14px; color: var(--fg); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; box-shadow: inset 0 1px 2px rgba(58,49,31,0.06); transition: all 200ms; }
  .input::placeholder { color: var(--fg-muted); }
  .input-focus { border-color: var(--rust-400); box-shadow: 0 0 0 3px rgba(196,115,63,0.18); outline: none; }
  .input-error { border-color: var(--clay-500); }
  .hint { font-family: var(--font-sans); font-size: 12px; color: var(--fg-3); }
  .err { font-family: var(--font-sans); font-size: 12px; color: var(--clay-500); }
</style>
</head><body>
<div class="grid">
  <div class="field">
    <label>Subject code</label>
    <input class="input" value="MATH 2200" />
    <div class="hint">e.g. MATH 2200, ENGL 1010</div>
  </div>
  <div class="field">
    <label>Term</label>
    <input class="input input-focus" value="Fall 2025" />
    <div class="hint">Focus state</div>
  </div>
  <div class="field">
    <label>Email</label>
    <input class="input input-error" value="not-a-valid-email" />
    <div class="err">Use your @uwyo.edu address.</div>
  </div>
  <div class="field">
    <label>Notes</label>
    <input class="input" placeholder="Anything to remember…" />
    <div class="hint">Placeholder state</div>
  </div>
</div>
</body></html>
