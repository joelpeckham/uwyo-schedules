<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 28px; }
  .grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 18px; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--fg-1); }
  .tile svg { width: 24px; height: 24px; }
  .l { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); }
  .note { font-family: var(--font-sans); font-size: 12px; color: var(--fg-2); margin-top: 18px; line-height: 1.5; }
</style>
</head><body>
<div class="grid">
  <div class="tile"><i data-lucide="calendar"></i><span class="l">calendar</span></div>
  <div class="tile"><i data-lucide="calendar-days"></i><span class="l">calendar-days</span></div>
  <div class="tile"><i data-lucide="book-open"></i><span class="l">book-open</span></div>
  <div class="tile"><i data-lucide="clock"></i><span class="l">clock</span></div>
  <div class="tile"><i data-lucide="map-pin"></i><span class="l">map-pin</span></div>
  <div class="tile"><i data-lucide="sliders-horizontal"></i><span class="l">sliders</span></div>
  <div class="tile"><i data-lucide="plus"></i><span class="l">plus</span></div>
  <div class="tile"><i data-lucide="x"></i><span class="l">x</span></div>
  <div class="tile"><i data-lucide="triangle-alert"></i><span class="l">alert</span></div>
  <div class="tile"><i data-lucide="check-circle-2"></i><span class="l">check</span></div>
  <div class="tile"><i data-lucide="search"></i><span class="l">search</span></div>
  <div class="tile"><i data-lucide="circle-user"></i><span class="l">user</span></div>
  <div class="tile"><i data-lucide="settings-2"></i><span class="l">settings</span></div>
  <div class="tile"><i data-lucide="bookmark"></i><span class="l">bookmark</span></div>
  <div class="tile"><i data-lucide="filter"></i><span class="l">filter</span></div>
  <div class="tile"><i data-lucide="arrow-right"></i><span class="l">arrow</span></div>
</div>
<p class="note">Lucide via CDN · stroke-width 1.75 · color inherits from <code style="font-family: var(--font-mono); font-size: 11px;">currentColor</code></p>
<script src="https://unpkg.com/lucide@latest"></script>
<script>lucide.createIcons({ attrs: { 'stroke-width': 1.75 } });</script>
</body></html>
