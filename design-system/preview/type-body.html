<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 24px 32px; }
  .row-spec { display: flex; align-items: baseline; justify-content: space-between; gap: 24px; padding: 10px 0; border-bottom: 1px solid var(--border-subtle); }
  .row-spec:last-child { border: 0; }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); white-space: nowrap; }
</style>
</head><body>
<div class="row-spec"><span style="font-family: var(--font-sans); font-size: 18px; font-weight: 600; color: var(--fg);">Add classes to start</span><span class="meta">h4 · sans 18 / 600</span></div>
<div class="row-spec"><span style="font-family: var(--font-sans); font-size: 16px; line-height: 1.65; color: var(--fg-1);">Pick your classes. We'll find every working combination — no Friday, mornings only, whatever you want.</span><span class="meta">body · sans 16 / 1.65</span></div>
<div class="row-spec"><span style="font-family: var(--font-sans); font-size: 14px; color: var(--fg-2);">Last updated 2 minutes ago</span><span class="meta">small · sans 14</span></div>
<div class="row-spec"><span style="font-family: var(--font-sans); font-size: 12px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-3);">Fall 2025 · Open</span><span class="meta">eyebrow · sans 12 caps</span></div>
<div class="row-spec"><span style="font-family: var(--font-mono); font-size: 14px; color: var(--fg-1); background: var(--bg-muted); padding: 4px 8px; border-radius: 4px;">MATH 2200 · 9:30–10:45 a.m.</span><span class="meta">mono · 14</span></div>
</body></html>
