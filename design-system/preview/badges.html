<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 32px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  .badge { font-family: var(--font-sans); font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 9999px; display: inline-flex; align-items: center; gap: 6px; }
  .b-primary { background: var(--rust-100); color: var(--rust-700); }
  .b-success { background: var(--sage-100); color: var(--sage-600); }
  .b-warning { background: var(--ochre-100); color: #6B4F18; }
  .b-danger { background: var(--clay-100); color: var(--clay-700); }
  .b-info { background: var(--sky-100); color: var(--sky-500); }
  .b-neutral { background: var(--cream-200); color: var(--sandstone-700); }
  .b-solid { background: var(--rust-400); color: var(--cream-50); }
  .b-outline { background: transparent; color: var(--fg-1); border: 1px solid var(--border-strong); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .label { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); width: 80px; }
</style>
</head><body>
<div class="row"><span class="label">soft</span>
  <span class="badge b-primary"><span class="dot"></span>Primary</span>
  <span class="badge b-success"><span class="dot"></span>Open</span>
  <span class="badge b-warning"><span class="dot"></span>Waitlist</span>
  <span class="badge b-danger"><span class="dot"></span>Closed</span>
  <span class="badge b-info"><span class="dot"></span>Online</span>
  <span class="badge b-neutral">Cancelled</span>
</div>
<div class="row"><span class="label">solid</span>
  <span class="badge b-solid">Recommended</span>
  <span class="badge b-outline">Draft</span>
  <span class="badge b-neutral">3 credits</span>
  <span class="badge b-neutral">MWF</span>
  <span class="badge b-neutral">CRN 30214</span>
</div>
</body></html>
