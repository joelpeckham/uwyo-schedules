<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 28px; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 16px; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 64px; height: 64px; background: var(--cream-200); border: 1px solid var(--border-strong); }
  .l { font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); }
  .px { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); }
</style>
</head><body>
<div class="grid">
  <div class="tile"><div class="box" style="border-radius: 3px;"></div><div class="l">xs</div><div class="px">3px</div></div>
  <div class="tile"><div class="box" style="border-radius: 6px;"></div><div class="l">sm</div><div class="px">6px</div></div>
  <div class="tile"><div class="box" style="border-radius: 10px;"></div><div class="l">md</div><div class="px">10px</div></div>
  <div class="tile"><div class="box" style="border-radius: 14px;"></div><div class="l">lg</div><div class="px">14px</div></div>
  <div class="tile"><div class="box" style="border-radius: 20px;"></div><div class="l">xl</div><div class="px">20px</div></div>
  <div class="tile"><div class="box" style="border-radius: 28px;"></div><div class="l">2xl</div><div class="px">28px</div></div>
  <div class="tile"><div class="box" style="border-radius: 9999px;"></div><div class="l">full</div><div class="px">pill</div></div>
</div>
</body></html>
