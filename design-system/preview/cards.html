<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 28px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .card { background: #FFF; border: 1px solid var(--border); border-radius: 10px; padding: 20px; box-shadow: 0 1px 2px rgba(58,49,31,0.06), 0 1px 3px rgba(58,49,31,0.08); }
  .card-hover { border-color: var(--border-strong); box-shadow: 0 4px 8px -2px rgba(58,49,31,0.08), 0 2px 4px -2px rgba(58,49,31,0.06); }
  .eyebrow { font-family: var(--font-sans); font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-3); }
  h3 { font-family: var(--font-serif); font-size: 22px; font-weight: 500; color: var(--fg); margin: 6px 0 8px; line-height: 1.2; letter-spacing: -0.01em; }
  p { font-family: var(--font-sans); font-size: 14px; line-height: 1.6; color: var(--fg-2); }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); margin-top: 12px; }
</style>
</head><body>
<div class="grid">
  <div class="card">
    <div class="eyebrow">Fall 2025</div>
    <h3>Discrete Mathematics</h3>
    <p>MWF mornings, no Friday. 3 sections open.</p>
    <div class="meta">MATH 2200 · 9:30–10:45 a.m.</div>
  </div>
  <div class="card card-hover">
    <div class="eyebrow">Hover state</div>
    <h3>Composition & Rhetoric</h3>
    <p>Border darkens, shadow lifts. No translate.</p>
    <div class="meta">ENGL 1010 · TR · 11:00 a.m.</div>
  </div>
</div>
</body></html>
