<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 20px 28px; }
  table { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 12px; color: var(--fg-2); }
  td { padding: 6px 12px; border-bottom: 1px solid var(--border-subtle); }
  td:first-child { color: var(--fg-3); width: 70px; }
  td:nth-child(2) { color: var(--fg-3); width: 70px; }
  td:last-child { font-family: var(--font-sans); color: var(--fg); }
</style>
</head><body>
<table>
  <tr><td>xs</td><td>12px</td><td style="font-size: 12px;">Aa — The quick brown fox</td></tr>
  <tr><td>sm</td><td>14px</td><td style="font-size: 14px;">Aa — The quick brown fox</td></tr>
  <tr><td>base</td><td>16px</td><td style="font-size: 16px;">Aa — The quick brown fox</td></tr>
  <tr><td>md</td><td>18px</td><td style="font-size: 18px;">Aa — The quick brown fox</td></tr>
  <tr><td>lg</td><td>20px</td><td style="font-size: 20px;">Aa — The quick brown</td></tr>
  <tr><td>xl</td><td>24px</td><td style="font-size: 24px;">Aa — The quick brown</td></tr>
  <tr><td>2xl</td><td>30px</td><td style="font-size: 30px; font-family: var(--font-serif);">Aa — The quick</td></tr>
  <tr><td>3xl</td><td>38px</td><td style="font-size: 38px; font-family: var(--font-serif); letter-spacing: -0.02em;">Aa — The quick</td></tr>
</table>
</body></html>
