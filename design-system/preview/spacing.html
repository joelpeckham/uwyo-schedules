<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 24px 32px; }

  .sp-px { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); width: 50px; }
  .sp-bar { height: 16px; background: var(--rust-300); border-radius: 2px; }
</style>
</head><body>
<div class="sp-row"><div class="sp-name">space-1</div><div class="sp-px">4px</div><div class="sp-bar" style="width: 4px;"></div></div>
<div class="sp-row"><div class="sp-name">space-2</div><div class="sp-px">8px</div><div class="sp-bar" style="width: 8px;"></div></div>

<div class="sp-row"><div class="sp-name">space-4</div><div class="sp-px">16px</div><div class="sp-bar" style="width: 16px;"></div></div>
<div class="sp-row"><div class="sp-name">space-6</div><div class="sp-px">24px</div><div class="sp-bar" style="width: 24px;"></div></div>
<div class="sp-row"><div class="sp-name">space-8</div><div class="sp-px">32px</div><div class="sp-bar" style="width: 32px;"></div></div>
<div class="sp-row"><div class="sp-name">space-12</div><div class="sp-px">48px</div><div class="sp-bar" style="width: 48px;"></div></div>
<div class="sp-row"><div class="sp-name">space-16</div><div class="sp-px">64px</div><div class="sp-bar" style="width: 64px;"></div></div>
<div class="sp-row"><div class="sp-name">space-24</div><div class="sp-px">96px</div><div class="sp-bar" style="width: 96px;"></div></div>
</body></html>
